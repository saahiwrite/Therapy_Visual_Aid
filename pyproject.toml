[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="therapy_visual_aid"
version="0.2.0"
requires-python=">=3.10"
dependencies=[
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pillow>=10.0",
    "httpx>=0.27",
]
[project.optional-dependencies]
dev=["pytest>=8.0"]
[tool.setuptools]
packages=["src"]
[tool.pytest.ini_options]
pythonpath=["."]
